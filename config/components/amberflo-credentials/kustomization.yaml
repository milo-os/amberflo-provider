apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# amberflo-credentials mounts keys from a Kubernetes Secret into the
# controller / submission-consumer pods.
#
# Expected Secret keys (namespace amberflo-provider-system by default):
#   api-key                 → /var/run/secrets/amberflo/api-key
#                             (required; Amberflo X-API-KEY)
#   webhook-signing-secret  → /var/run/secrets/amberflo/webhook-signing-secret
#                             (optional; Amberflo invoice webhook shared secret)
#
# Create with `task test:create-amberflo-credentials` (reads
# AMBERFLO_API_KEY and optional AMBERFLO_WEBHOOK_SECRET from .env), or:
#
#   kubectl create secret generic amberflo-credentials \
#     --namespace amberflo-provider-system \
#     --from-literal=api-key="$AMBERFLO_API_KEY" \
#     --from-literal=webhook-signing-secret="$AMBERFLO_WEBHOOK_SECRET"
#
# The manager mounts the whole Secret (so missing webhook key does not
# block the pod). Invoice webhooks stay disabled until the signing-secret
# file or AMBERFLO_WEBHOOK_SECRET is present. Rotate by updating the
# Secret and rolling the Deployment.

patches:
  - target:
      kind: Deployment
      name: amberflo-provider
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: amberflo-provider
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: AMBERFLO_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: amberflo-credentials
                        key: api-key
                  - name: AMBERFLO_WEBHOOK_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: amberflo-credentials
                        key: webhook-signing-secret
                        optional: true
                volumeMounts:
                  - mountPath: /var/run/secrets/amberflo
                    name: amberflo-credentials
                    readOnly: true
            volumes:
              - name: amberflo-credentials
                secret:
                  secretName: amberflo-credentials
  - target:
      kind: Deployment
      name: submission-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: submission-consumer
      spec:
        template:
          spec:
            containers:
              - name: submission-consumer
                env:
                  - name: AMBERFLO_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: amberflo-credentials
                        key: api-key
                volumeMounts:
                  - mountPath: /var/run/secrets/amberflo
                    name: amberflo-credentials
                    readOnly: true
            volumes:
              - name: amberflo-credentials
                secret:
                  secretName: amberflo-credentials
                  items:
                    - key: api-key
                      path: api-key
